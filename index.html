<h1>Jarvis</h1>
<p>Jarvis é um assistente pessoal de uso privado. Ele organiza a agenda, tarefas e documentos do seu único usuário e conversa com ele por um canal privado.</p>
<p>Não é um serviço aberto ao público e não aceita cadastro de outras pessoas.</p>
